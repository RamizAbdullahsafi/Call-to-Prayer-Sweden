<!DOCTYPE html>
<html lang="sv" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Bönetider för Sverige med valfri adhan och påminnelser."
    />
    <meta name="theme-color" content="#d2d8e4" />
    <meta name="color-scheme" content="light" />
    <style id="ctp-boot-surface">
      html {
        background-color: #d2d8e4;
        color-scheme: light;
      }
      body {
        margin: 0;
        background-color: #d2d8e4;
        color: #1a2332;
        min-height: 100dvh;
        min-height: 100vh;
      }
      #app {
        min-height: 100dvh;
        min-height: 100vh;
        background-color: transparent;
      }
    </style>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Same artwork as Android adaptive icon (public/icon.svg) -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Call to Prayer Sweden</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var KEY = "ctp.locale";
          var VALID = { sv: 1, en: 1, ar: 1, fa: 1, ku: 1, so: 1 };
          var RTL = { ar: 1, fa: 1 };
          var LANG = { sv: "sv", en: "en", ar: "ar", fa: "fa", ku: "ku", so: "so" };
          var stored = localStorage.getItem(KEY);
          if (!stored || !VALID[stored]) return;
          document.documentElement.setAttribute("lang", LANG[stored] || "sv");
          document.documentElement.setAttribute("dir", RTL[stored] ? "rtl" : "ltr");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
